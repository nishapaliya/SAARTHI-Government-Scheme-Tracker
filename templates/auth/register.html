{% extends 'base.html' %}

{% block title %}Citizen Registration & e-KYC | SAARTHI Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card glass-card border-0 rounded-5 shadow-2xl overflow-hidden">
                <div class="card-header bg-primary-blue text-white text-center p-4">
                    <h4 class="font-outfit fw-bold mb-1"><i class="fa-solid fa-id-card me-2"></i> Citizen Registration</h4>
                    <p class="fs-8 text-white-50 mb-0">Create your unified benefit profile for 1-click scheme applications</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST" action="{{ url_for('auth.register') }}" id="registerForm">
                        <!-- Step 1: Aadhaar e-KYC Simulation -->
                        <div class="p-3 bg-blue-subtle rounded-4 mb-4 border border-primary-subtle">
                            <h6 class="font-outfit fw-bold text-primary-blue mb-2"><i class="fa-solid fa-shield-halved me-1"></i> Identity Validation</h6>
                            <div class="row g-2 align-items-center">
                                <div class="col-md-8">
                                    <input type="text" name="aadhaar_no" id="regAadhaar" class="form-control rounded-4 fs-7" placeholder="Enter 12-Digit Aadhaar (e.g. 567890123456)" maxlength="12" required>
                                </div>
                                <div class="col-md-4">
                                    <button type="button" class="btn btn-primary-blue w-100 rounded-4 fs-7 fw-bold" onclick="simulateEKYC()">
                                        <i class="fa-solid fa-check-circle me-1"></i> Verify Identity
                                    </button>
                                </div>
                            </div>
                            <div id="ekycBadge" class="fs-8 mt-2" style="display:none;"></div>
                        </div>

                        <!-- Step 2: Personal Profile -->
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label font-outfit fw-bold fs-7">Full Name (As in Aadhaar)</label>
                                <input type="text" name="full_name" class="form-control rounded-4 fs-7" placeholder="Vikram Singh" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label font-outfit fw-bold fs-7">Email Address</label>
                                <input type="email" name="email" class="form-control rounded-4 fs-7" placeholder="vikram.singh@gmail.com" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label font-outfit fw-bold fs-7">Mobile Number (Aadhaar Linked)</label>
                                <input type="text" name="mobile" class="form-control rounded-4 fs-7" placeholder="9876543210" maxlength="10" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label font-outfit fw-bold fs-7">Password</label>
                                <input type="password" name="password" class="form-control rounded-4 fs-7" placeholder="••••••••" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label font-outfit fw-bold fs-7">Date of Birth</label>
                                <input type="date" name="dob" class="form-control rounded-4 fs-7" value="1994-05-12">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-outfit fw-bold fs-7">Gender</label>
                                <select name="gender" class="form-select rounded-4 fs-7">
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Transgender">Transgender</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label font-outfit fw-bold fs-7">Social Category</label>
                                <select name="category" class="form-select rounded-4 fs-7">
                                    <option value="General">General</option>
                                    <option value="OBC">OBC</option>
                                    <option value="SC">SC</option>
                                    <option value="ST">ST</option>
                                    <option value="EWS">EWS</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label font-outfit fw-bold fs-7">Annual Income (₹)</label>
                                <input type="number" name="income_annual" class="form-control rounded-4 fs-7" value="150000">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label font-outfit fw-bold fs-7">Occupation</label>
                                <input type="text" name="occupation" class="form-control rounded-4 fs-7" value="Agriculture / Self Employed">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label font-outfit fw-bold fs-7">State</label>
                                <input type="text" name="state" class="form-control rounded-4 fs-7" value="Uttar Pradesh">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label font-outfit fw-bold fs-7">District</label>
                                <input type="text" name="district" class="form-control rounded-4 fs-7" value="Varanasi">
                            </div>
                        </div>

                        <!-- Step 3: DBT Bank Details -->
                        <div class="p-3 bg-light-surface rounded-4 my-4 border">
                            <h6 class="font-outfit fw-bold text-dark mb-2"><i class="fa-solid fa-building-columns text-primary me-1"></i> Direct Benefit Transfer (DBT) Bank Account</h6>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label font-outfit fw-bold fs-8">Bank Account Number</label>
                                    <input type="text" name="dbt_bank_account" class="form-control rounded-4 fs-7" value="918273645012">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label font-outfit fw-bold fs-8">IFSC Code</label>
                                    <input type="text" name="ifsc_code" class="form-control rounded-4 fs-7" value="SBIN0001234">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label font-outfit fw-bold fs-8">Bank Name</label>
                                    <input type="text" name="bank_name" class="form-control rounded-4 fs-7" value="State Bank of India">
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-gradient w-100 rounded-pill py-3 font-outfit fw-bold text-white shadow-md">
                            <i class="fa-solid fa-check-double me-2"></i> Register & Create Citizen Profile
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
