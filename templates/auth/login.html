{% extends 'base.html' %}

{% block title %}Citizen & Officer Login | SAARTHI Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card glass-card border-0 rounded-5 shadow-2xl overflow-hidden">
                <div class="card-header bg-primary-blue text-white text-center p-4">
                    <div class="saarthi-emblem-icon bg-white text-primary-gold mx-auto mb-2 p-2 rounded-circle shadow-sm" style="width: 50px; height: 50px;">
                        <i class="fa-solid fa-dharmachakra fs-3"></i>
                    </div>
                    <h4 class="font-outfit fw-bold mb-1">Sign In to SAARTHI</h4>
                    <p class="fs-8 text-white-50 mb-0">Access Citizen Benefit Tracker or Nodal Portal</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label class="form-label font-outfit fw-bold fs-7">Email or 12-Digit Aadhaar No.</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 rounded-start-4"><i class="fa-solid fa-user text-muted"></i></span>
                                <input type="text" name="email" class="form-control form-control-lg border-start-0 rounded-end-4 fs-7" placeholder="ramesh.patel@gmail.com or 234567890123" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label font-outfit fw-bold fs-7">Password</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 rounded-start-4"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" name="password" class="form-control form-control-lg border-start-0 rounded-end-4 fs-7" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-gradient w-100 rounded-pill py-3 font-outfit fw-bold text-white shadow-md">
                            <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to Portal
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-light-surface text-center py-3 border-0">
                    <span class="fs-7 text-muted">New citizen? </span>
                    <a href="{{ url_for('auth.register') }}" class="font-outfit fw-bold text-primary-blue text-decoration-none fs-7">Create Account via e-KYC</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
